<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美鈴の家族計画</title>
    <meta property="og:title" content="美鈴の家族計画" />
    <meta property="og:description" content="ノベルゲーム風に読める二次創作" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="scene" id="stage">
        <div class="scene-dim" id="sceneDim"></div>
        <div class="chapter-pill" id="chapterPill">
          <div class="chapter-title" id="chapterTitle"></div>
          <div class="chapter-ep" id="chapterSubtitle"></div>
        </div>

        <div class="spacer"></div>

        <div class="message-window">
          <div class="name-tag" id="name"></div>
          <div class="text" id="text">読み込み中...</div>
          <div class="caret">▼</div>
        </div>

        <div class="hud">
          <button id="prevBtn" class="hud-btn" disabled>戻る</button>
          <button id="nextBtn" class="hud-btn primary">次へ</button>
          <button id="skipBtn" class="hud-btn ghost" type="button">SKIP</button>
          <button id="logBtn" class="hud-btn ghost" type="button">ログ</button>
          <button class="hud-btn ghost" type="button">AUTO</button>
          <button class="hud-btn ghost" type="button">早送り</button>
          <button id="saveBtn" class="hud-btn" type="button">セーブ</button>
          <button id="quickSaveBtn" class="hud-btn" type="button">クイックセーブ</button>
          <button id="loadBtn" class="hud-btn" type="button">ロード</button>
          <button id="openBtn" class="hud-btn" type="button">本文を選ぶ</button>
          <div class="progress" id="progress">0/0</div>
        </div>
      </div>

      <input type="file" id="fileInput" accept=".txt,text/plain" hidden />

      <div class="slot-modal" id="slotModal" aria-hidden="true">
        <div class="slot-panel">
          <div class="slot-header">
            <div class="slot-title" id="slotTitle">セーブ</div>
            <button id="slotCloseBtn" class="slot-close" type="button">閉じる</button>
          </div>
          <div class="slot-grid" id="slotGrid"></div>
        </div>
      </div>

      <div class="log-modal" id="logModal" aria-hidden="true">
        <div class="log-panel">
          <div class="log-header">
            <div class="log-title">ログ</div>
            <button id="logCloseBtn" class="slot-close" type="button">閉じる</button>
          </div>
          <div class="log-list" id="logList"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
